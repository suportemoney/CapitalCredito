name: Deploy VPS

on:
  push:
    branches: [primeira-versao]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH (tentativa 1)
        id: deploy_try1
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 120s
          command_timeout: 30m
          script: bash /home/capitalcredito/sistema-capitalcredito/vps/deploy.sh

      - name: Deploy via SSH (tentativa 2)
        if: steps.deploy_try1.outcome == 'failure'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 120s
          command_timeout: 30m
          script: bash /home/capitalcredito/sistema-capitalcredito/vps/deploy.sh
