<div class="ger-equipes-panel" id="panel-equipes" hidden>
  <section class="ger-mid-row ger-mid-row--equipes">
    <article class="ger-card ger-card--full">
      <div class="ger-card__head">
        <div>
          <h2>Equipes</h2>
          <p class="ger-card__hint">Gerencie participantes vinculados às campanhas</p>
        </div>
        <button type="button" class="ger-btn ger-btn--primary" id="btn-abrir-modal-equipe-nova">
          <i class="ph ph-plus"></i> Nova equipe
        </button>
      </div>
      <div class="ger-table-wrap">
        <table class="ger-table" id="tabela-equipes">
          <thead>
            <tr><th>Nome</th><th>Membros</th><th>Status</th><th>Ações</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </article>
    <article class="ger-card">
      <h2 id="equipe-membros-titulo">Membros da equipe</h2>
      <p class="ger-card__hint" id="equipe-membros-hint">Selecione uma equipe ou clique em Gerenciar</p>
      <div class="ger-table-wrap">
        <table class="ger-table" id="tabela-equipe-membros">
          <thead><tr><th>Usuário</th><th>Nome</th><th>Ações</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </article>
  </section>
</div>
