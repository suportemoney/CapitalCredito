<div class="modal fade bonificacoes-modal-modern" id="modalRegra" tabindex="-1" aria-hidden="true" style="z-index: 100001;">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content bonificacoes-modal-content">
            <div class="modal-header bonificacoes-modal-header">
                <h5 class="modal-title" id="modalRegraTitle">Nova Regra</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>
            <div class="modal-body bonificacoes-modal-body">
                <input type="hidden" id="modal-regra-id">
                <div class="mb-2">
                    <label class="form-label">Nome</label>
                    <input type="text" class="form-control" id="modal-regra-nome" placeholder="Nome da regra">
                </div>
                <div class="mb-2">
                    <label class="form-label">Tipo de Regra</label>
                    <select class="form-select" id="modal-regra-tipo">
                        <option value="percentual">Percentual Simples</option>
                        <option value="gatilho_percentual">Gatilho + Percentual</option>
                        <option value="gatilho_valor_fixo">Gatilho + Valor Fixo</option>
                    </select>
                </div>
                <div class="mb-2" id="container-percentual-padrao">
                    <label class="form-label">Percentual Padrão (%)</label>
                    <input type="number" class="form-control" id="modal-regra-percentual" step="0.01" min="0" max="100" placeholder="Ex: 5">
                </div>
                <div class="mb-2">
                    <label class="form-label">Campo de Valor</label>
                    <select class="form-select" id="modal-regra-campo">
                        <option value="valor_af">Valor AF</option>
                        <option value="valor_repasse">Valor Repasse</option>
                    </select>
                </div>
                <div class="mb-2">
                    <label class="form-label">Ativo</label>
                    <select class="form-select" id="modal-regra-ativo">
                        <option value="true">Sim</option>
                        <option value="false">Não</option>
                    </select>
                </div>
                <div id="container-gatilhos" style="display:none;">
                    <div class="section-header"><h6 class="mb-2">Gatilhos</h6></div>
                    <div id="lista-gatilhos"></div>
                    <button type="button" class="btn btn-sm btn-outline-secondary mt-2" id="btnAdicionarGatilho">+ Adicionar Gatilho</button>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-primary" id="btnSalvarRegra">Salvar</button>
            </div>
        </div>
    </div>
</div>
