# Redireciona HTTP para HTTPS
server {
    listen 80;
    server_name sistema.capitalcredito.net 168.231.97.235;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Servidor HTTPS para o Django
server {
    listen 443 ssl http2;
    server_name sistema.capitalcredito.net 168.231.97.235;

    # até 500 MB por requisição
    client_max_body_size 500M;

    # certificados SSL gerados pelo Certbot
    ssl_certificate /etc/letsencrypt/live/sistema.capitalcredito.net/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/sistema.capitalcredito.net/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options         DENY;
    add_header X-Content-Type-Options  nosniff;
    add_header X-XSS-Protection        "1; mode=block";

    # proxy para o seu Django rodando na porta 6001
    location / {
        proxy_pass http://127.0.0.1:6001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # servir arquivos estáticos
    location /static/ {
        alias /home/capitalcredito/sistema-capitalcredito/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # servir arquivos de mídia
    location /media/ {
        alias /home/capitalcredito/sistema-capitalcredito/media/;
        expires 30d;
        add_header Cache-Control "public";
    }

    # página de erro 404 customizada (opcional)
    error_page 404 /404.html;
    location = /404.html {
        root /var/www/html;
    }
}
